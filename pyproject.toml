[project]
name = "truesignal"
version = "0.1.0"
description = "Self-tuning SAST agent: learns customer code semantics, persists them as CxQL overrides"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
web = ["flask>=3", "waitress>=2"]
finetune = ["torch", "transformers>=4.40", "peft>=0.10", "trl>=0.8", "datasets>=2.18"]
test = ["pytest>=7"]

[project.scripts]
truesignal = "truesignal.cli:main"
truesignal-ui = "truesignal.webapp.server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["demos", "fixtures", ".truesignal", ".truesignal_ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
packages = ["truesignal", "truesignal.webapp"]
include-package-data = true

[tool.setuptools.package-data]
"truesignal.webapp" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
